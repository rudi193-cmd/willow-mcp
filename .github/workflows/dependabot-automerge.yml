name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

# Deliberately NO `gh pr update-branch` anywhere in this workflow: pushes made
# with GITHUB_TOKEN do not trigger workflow runs, so a token-made update
# strands the PR on a head commit that CI will never report on — auto-merge
# then waits forever. Arming auto-merge is sufficient: when branch protection
# has "require branches to be up to date", GitHub updates the branch
# server-side, and THAT update runs CI normally.

jobs:
  dependabot-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.update-type == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  refresh-stale-dependabot-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-arm auto-merge on open Dependabot PRs after the base moves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "${{ github.repository }}" --state open --author app/dependabot --json number --jq '.[].number')
          for pr in "${prs[@]}"; do
            echo "Re-arming auto-merge on Dependabot PR #${pr}"
            gh pr merge --auto --merge "$pr" --repo "${{ github.repository }}" || true
          done
