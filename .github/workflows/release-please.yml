name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every merge
# to master — bumping the proposed version from conventional-commit prefixes,
# appending the CHANGELOG entry, and bumping .claude-plugin/plugin.json to match
# (see extra-files in release-please-config.json). Nothing publishes while it
# sits there. It arms auto-merge on itself, so when CI goes green it merges, the
# tag is created, and the tag push fires `release.yml`.
#
# Before this, releasing meant tagging by hand and remembering that plugin.json
# carries its own version string — which is how it drifted to 2.0.0 while the
# package was 2.0.1.
#
# WHY THE PAT, in both places below. This is the lesson jeles paid three
# releases to learn, and it fails silently every time:
#
#   1. GitHub suppresses workflow runs for any event generated with
#      GITHUB_TOKEN. Not just `push: tags` — `release: published` too. A
#      workflow waiting on either simply never runs, with no error anywhere.
#      jeles v0.2.0: tagged, released, absent from PyPI.
#   2. Calling release.yml via `workflow_call` does start it, but then PyPI
#      authenticates against `job_workflow_ref` (the callee) while the PEP 740
#      attestation records `workflow_ref` (the caller). The two claims disagree
#      by construction and no publisher row reconciles them. jeles v0.2.1 and
#      v0.3.0: built fine, rejected at upload.
#   3. A PAT is not a bot token, so the tag it pushes triggers workflows
#      normally, and caller and callee are the same file.
#
#   The same applies to arming auto-merge: GitHub attributes an auto-merge to
#   whoever armed it, so armed with GITHUB_TOKEN the release PR would merge and
#   this workflow would never run again to cut the tag.
#
# SETUP — `RELEASE_PLEASE_TOKEN` must exist as a repository secret: a
# fine-grained PAT scoped to this repo with Contents: read/write and Pull
# requests: read/write (classic equivalent: `repo`). The first job below refuses
# to run without it rather than falling back to GITHUB_TOKEN, because that
# fallback produces a working-looking release PR and a publish that never
# happens.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the release PAT
        # jeles documents this requirement in a comment and trusts the reader.
        # A missing secret there degrades to GITHUB_TOKEN, which still opens a
        # release PR — so everything looks healthy right up until nothing
        # reaches PyPI. Fail here, where the message can say what to do.
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set on this repository."
            cat <<'MSG'
          release-please would fall back to GITHUB_TOKEN, and the release PR
          would look fine — but the tag it pushes would start no workflow, so
          release.yml would never run and nothing would reach PyPI. Silently.

          Add a fine-grained PAT scoped to this repo with:
            Contents: read/write
            Pull requests: read/write
          as the repository secret RELEASE_PLEASE_TOKEN.
          MSG
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN present"

      # Needed by the changelog step below, which reads git history rather than
      # trusting the generated text. `fetch-depth: 0` plus tags is load-bearing:
      # the entries are derived from `git log <previous tag>..<this release>`,
      # and a shallow clone cannot see either end of that range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Correct the section release-please just wrote, on the release PR, before
      # auto-merge is armed below — so the changelog is right when the release
      # ships rather than fixed afterwards.
      #
      # This repo merges with merge commits rather than squashing, and GitHub
      # writes the PR title into the merge commit *body*. release-please parses
      # that body, so one change reaches it twice: once as the real commit, once
      # as the merge commit carrying its title. 2.1.2 listed the same fix twice;
      # 2.1.3 listed the merge commit and dropped `0073767` — a shipped fix, left
      # undocumented, with a synthetic entry standing in for it. Both were
      # corrected by hand, which is what this replaces.
      #
      # No `if:` on a release-please output — whether an open release PR exists is
      # read from GitHub below, which is the thing actually being acted on. One
      # less assumption about an action's output names between the check and the
      # work.
      - name: Rebuild the changelog section from the commits
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                           | first | .headRefName // empty')
          if [ -z "$branch" ]; then
            echo "No open release PR — nothing releasable, nothing to correct."
            exit 0
          fi

          git fetch --tags origin "$branch"
          git checkout "$branch"

          # Exit 2 means the tool found something it does not model (a breaking
          # change, an unreadable range). Fail the step rather than ship a
          # section nobody checked — the release PR is still there to fix by hand.
          python tools/changelog_dedup.py

          if git diff --quiet -- CHANGELOG.md; then
            echo "release-please's section already matches the commits."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: rebuild the changelog section from the commits

          release-please parsed the merge commits alongside the commits they
          merge, because this repo does not squash-merge. See
          tools/changelog_dedup.py."
          git push origin "$branch"

      # Arm auto-merge, so a release ships when CI goes green rather than when
      # someone remembers the PR is open. Re-armed on every push to master,
      # which is also the self-heal: release-please rewrites the PR as commits
      # land, and this puts the arming back either way.
      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                       | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR — nothing releasable since the last tag."
            exit 0
          fi

          echo "Arming auto-merge on release PR #${pr}"
          if gh pr merge --auto --merge "$pr" --repo "$REPO"; then
            exit 0
          fi

          # Do not fall back to merging directly. `--auto` is what makes the
          # merge wait for CI; merging here instead would publish off an
          # unverified commit, and a PyPI version can never be reused or
          # replaced. Fail loudly and say what to fix.
          cat <<'MSG'
          ::error::Could not arm auto-merge on the release PR.

          Both of these must hold, and GitHub declines quietly otherwise:
            1. Settings -> General -> "Allow auto-merge" is enabled.
            2. master's branch protection requires at least one status check
               (this repo's is the aggregate `test` job). With no required
               check there is nothing for auto-merge to wait on, so GitHub
               will not arm it at all.

          Releases still work — the PR is there to merge by hand.
          MSG
          exit 1
