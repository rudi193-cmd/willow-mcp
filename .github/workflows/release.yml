name: Release

# Publishes to PyPI when a version tag is pushed (e.g. `git tag v2.0.0 && git push --tags`).
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# One-time setup before the first release:
#   1. On PyPI: project → Publishing → add a trusted publisher for this repo,
#      workflow `release.yml`, environment `pypi`.
#   2. Create a GitHub environment named `pypi` (Settings → Environments).
# Until that is configured, this workflow is inert — nothing publishes without a tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, so the tags must be
          # present. The default shallow checkout fetches none of them and the
          # build would silently produce a wrong (much older) version.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert the tag matches the built version
        # kartikeya shipped a v0.0.8 tag whose build produced 0.0.7, and nothing
        # caught it until PyPI refused the duplicate upload. Fail here instead,
        # where the error says what is actually wrong.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's|.*/willow_mcp-(.+)\.tar\.gz|\1|')"
          echo "tag=${tag}  built=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v${tag} builds version ${built} — refusing to publish"
            exit 1
          fi

      - name: Assert the plugin manifest matches the tag
        # .claude-plugin/plugin.json carries its own version string that nothing
        # derived it from; it had drifted to 2.0.0 while the package was 2.0.1.
        # Checked at release time rather than on every dev run, because off-tag
        # builds legitimately carry a .devN suffix.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin="$(python -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          echo "tag=${tag}  plugin.json=${plugin}"
          if [ "$tag" != "$plugin" ]; then
            echo "::error::.claude-plugin/plugin.json says ${plugin}, tag is v${tag} — bump it"
            exit 1
          fi

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # This repo had no tags at all, so the already-published releases
          # (v1.0.0 … v2.0.1) still need tagging retroactively. Pushing those
          # tags fires this workflow against versions PyPI already holds;
          # skip-existing makes that a no-op instead of five red runs.
          skip-existing: true
